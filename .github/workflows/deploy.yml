name: Deploy Agent with Eval Gate & Blue/Green

on:
  push:
    branches: [main]

permissions:
  id-token: write # Required for OIDC authentication to Azure
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZ_CLIENT_ID }}
          tenant-id: ${{ vars.AZ_TENANT_ID }}
          subscription-id: ${{ vars.AZ_SUBSCRIPTION_ID }}
      - name: Build and push to ACR
        run: |
          export TAG=${{ github.sha }}
          az acr build --registry ${{ vars.ACR_NAME }} --image bank-triage-agent:$TAG --file Dockerfile .

  eval-gate:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run Eval Gate (Blocks if regression > 2%)
        run: |
          python scripts/eval_gate.py \
            --golden data/golden.jsonl \
            --baseline data/baseline.json \
            --policy app/policies/policy_v1.json \
            --max-regression 0.02
      - name: Generate Model Card
        run: |
          python scripts/model_card.py \
            --app-version "1.0.${{ github.run_number }}" \
            --git-sha ${{ github.sha }} \
            --policy app/policies/policy_v1.json \
            --eval-passed 5 --eval-total 5
      - name: Upload Model Card Artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-card
          path: app/model_card.json

  deploy-blue-green:
    needs: eval-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZ_CLIENT_ID }}
          tenant-id: ${{ vars.AZ_TENANT_ID }}
          subscription-id: ${{ vars.AZ_SUBSCRIPTION_ID }}
      - name: Create .env for deployment scripts
        run: |
          echo "RG=${{ vars.RG }}" > .env
          echo "LOCATION=${{ vars.LOCATION || 'eastus' }}" >> .env
          echo "ACR=${{ vars.ACR_NAME }}" >> .env
          echo "ACA_ENV=${{ vars.ACA_ENV || 'cae-lab10' }}" >> .env
          echo "APP=${{ vars.APP_NAME }}" >> .env
          echo "TAG=${{ github.sha }}" >> .env
      - name: Deploy to Container Apps
        run: |
          az acr update --name ${{ vars.ACR_NAME }} --admin-enabled true
          bash deploy/02_deploy_containerapp.sh